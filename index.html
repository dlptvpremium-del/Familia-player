<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #f5f5f5;
      padding: 16px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #2a2a2a;
      color: #ddd;
    }
    button.active-tab {
      background: #2e7d32;
      color: #fff;
    }
    video {
      width: 100%;
      max-height: 240px;
      background: #000;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .status {
      font-size: 0.9rem;
      color: #bbb;
      margin-bottom: 12px;
    }
    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 10px;
      background: #1e1e1e;
      cursor: pointer;
    }
    .channel-name {
      flex: 1;
      padding-right: 10px;
    }
    .fav-btn {
      background: transparent;
      color: #ffd54f;
      font-size: 1.25rem;
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <h1>Mi IPTV Player</h1>

  <div class="row">
    <input id="urlInput" type="text" placeholder="Pega URL de lista .m3u / .m3u8..." />
    <button id="loadUrlBtn" type="button">Cargar URL</button>
  </div>

  <div class="row">
    <button id="uploadBtn" type="button">Subir .m3u</button>
    <input id="fileInput" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl,.txt" hidden />
  </div>

  <video id="videoPlayer" controls playsinline></video>
  <div id="nowPlaying" class="status">Reproduciendo: Ningún canal</div>
  <div id="errorMsg" class="status" style="color:#ff8a80;"></div>

  <div class="row">
    <button id="tabAll" class="active-tab" type="button">Todos</button>
    <button id="tabFavs" class="secondary" type="button">Favoritos</button>
  </div>

  <div id="channelList" class="channel-list"></div>
