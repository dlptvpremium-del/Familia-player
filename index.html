<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>Mi IPTV Player</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #f5f5f5;
      padding: 16px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    .panel {
      background: #181818;
      border: 1px solid #282828;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .panel-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ddd;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    input[type="text"],
    input[type="password"] {
      flex: 1;
      min-width: 140px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
    }
    input[type="file"] {
      max-width: 100%;
      color: #ddd;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #2a2a2a;
      color: #ddd;
    }
    button.active-tab {
      background: #2e7d32;
      color: #fff;
    }
    video {
      width: 100%;
      max-height: 240px;
      background: #000;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .status {
      font-size: 0.9rem;
      color: #bbb;
      margin-bottom: 8px;
    }
    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 10px;
      background: #1e1e1e;
      cursor: pointer;
    }
    .channel-name {
      flex: 1;
      padding-right: 10px;
    }
    .fav-btn {
      background: transparent;
      color: #ffd54f;
      font-size: 1.25rem;
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <h1>Mi IPTV Player</h1>

  <div class="panel">
    <div class="panel-title">Lista M3U / M3U8 (URL o archivo local)</div>
    <div class="row">
      <input id="urlInput" type="text" placeholder="Pega URL (http:// o https://raw.githubusercontent.com/...)" />
      <button id="loadUrlBtn" type="button">Cargar URL</button>
    </div>
    <div class="row">
      <input
        id="fileInput"
        type="file"
        accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl,.txt,text/plain,*/*"
      />
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Xtream Codes</div>
    <div class="row">
      <input id="xtreamHost" type="text" placeholder="Servidor (ej: http://servidor:8080)" />
      <input id="xtreamUser" type="text" placeholder="Usuario" />
      <input id="xtreamPass" type="password" placeholder="Contraseña" />
      <button id="xtreamConnectBtn" type="button">Conectar</button>
    </div>
  </div>

  <video id="videoPlayer" controls playsinline></video>
  <div id="nowPlaying" class="status">Reproduciendo: Ningún canal</div>
  <div id="errorMsg" class="status" style="color:#ff8a80;"></div>

  <div class="row">
    <button id="tabAll" class="active-tab" type="button">Todos</button>
    <button id="tabFavs" class="secondary" type="button">Favoritos</button>
  </div>

  <div id="channelList" class="channel-list"></div>

  <script>
    const STORAGE_FAVS_KEY = "mi_iptv_favoritos_v2";
    const STORAGE_XTREAM_KEY = "mi_iptv_xtream_v1";

    const urlInput = document.getElementById("urlInput");
    const loadUrlBtn = document.getElementById("loadUrlBtn");
    const fileInput = document.getElementById("fileInput");
    const xtreamHost = document.getElementById("xtreamHost");
    const xtreamUser = document.getElementById("xtreamUser");
    const xtreamPass = document.getElementById("xtreamPass");
    const xtreamConnectBtn = document.getElementById("xtreamConnectBtn");
    const videoPlayer = document.getElementById("videoPlayer");
    const nowPlaying = document.getElementById("nowPlaying");
    const errorMsg = document.getElementById("errorMsg");
    const tabAll = document.getElementById("tabAll");
    const tabFavs = document.getElementById("tabFavs");
    const channelListEl = document.getElementById("channelList");

    let channels = [];
    let favoritesMap = loadFavoritesMap();
    let activeTab = "all";
    let hlsInstance = null;

    function getChannelKey(channel) {
      return channel.url.trim();
    }

    function loadFavoritesMap() {
      try {
        const raw = localStorage.getItem(STORAGE_FAVS_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        const map = new Map();
        if (Array.isArray(parsed)) {
          parsed.forEach((ch) => {
            if (ch && ch.url) {
              map.set(getChannelKey(ch), { name: ch.name || "Canal sin nombre", url: ch.url });
            }
          });
        }
        return map;
      } catch {
        return new Map();
      }
    }

    function saveFavoritesMap() {
      try {
        localStorage.setItem(STORAGE_FAVS_KEY, JSON.stringify([...favoritesMap.values()]));
      } catch {
        errorMsg.textContent = "No se pudieron guardar los favoritos en el navegador.";
      }
    }

    function loadXtreamProfile() {
      try {
        const raw = localStorage.getItem(STORAGE_XTREAM_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p.host) xtreamHost.value = p.host;
        if (p.user) xtreamUser.value = p.user;
        if (p.pass) xtreamPass.value = p.pass;
      } catch {}
    }

    function saveXtreamProfile(host, user, pass) {
      try {
        localStorage.setItem(STORAGE_XTREAM_KEY, JSON.stringify({ host, user, pass }));
      } catch {}
    }

    function parseM3U(content) {
      const cleanContent = content.replace(/^\uFEFF/, "");
      const lines = cleanContent.split(/\r?\n/);
      const parsed = [];
      let pendingName = null;

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;

        if (line.startsWith("#EXTINF")) {
          const commaIndex = line.indexOf(",");
          const title = commaIndex !== -1 ? line.slice(commaIndex + 1).trim() : "";
          pendingName = title || "Canal sin nombre";
          continue;
        }

        if (!line.startsWith("#")) {
          parsed.push({
            name: pendingName || "Canal sin nombre",
            url: line
          });
          pendingName = null;
        }
      }

      return parsed;
    }

    function readFileAsText(file) {
      if (typeof file.text === "function") {
        return file.text();
      }
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("Error leyendo archivo"));
        reader.readAsText(file);
      });
    }

    async function fetchTextWithFallback(targetUrl) {
      try {
        const directRes = await fetch(targetUrl);
        if (directRes.ok) {
          return await directRes.text();
        }
      } catch {}

      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
      const proxyRes = await fetch(proxyUrl);
      if (!proxyRes.ok) {
        throw new Error(`HTTP ${proxyRes.status}`);
      }
      return await proxyRes.text();
    }

    function renderChannels() {
      const visibleChannels =
        activeTab === "favs"
          ? [...favoritesMap.values()]
          : channels;

      channelListEl.innerHTML = "";

      if (visibleChannels.length === 0) {
        const empty = document.createElement("div");
        empty.className = "status";
        empty.textContent =
          activeTab === "favs"
            ? "Aún no tienes canales en Favoritos."
            : "No hay canales cargados.";
        channelListEl.appendChild(empty);
        return;
      }

      visibleChannels.forEach((channel) => {
        const key = getChannelKey(channel);
        const isFav = favoritesMap.has(key);

        const item = document.createElement("div");
        item.className = "channel-item";

        const nameSpan = document.createElement("span");
        nameSpan.className = "channel-name";
        nameSpan.textContent = channel.name;
        nameSpan.addEventListener("click", () => playChannel(channel));

        const favBtn = document.createElement("button");
        favBtn.type = "button";
        favBtn.className = "fav-btn";
        favBtn.setAttribute("aria-label", isFav ? "Quitar de favoritos" : "Añadir a favoritos");
        favBtn.textContent = isFav ? "★" : "☆";
        favBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          if (favoritesMap.has(key)) {
            favoritesMap.delete(key);
          } else {
            favoritesMap.set(key, { name: channel.name, url: channel.url });
          }
          saveFavoritesMap();
          renderChannels();
        });

        item.appendChild(nameSpan);
        item.appendChild(favBtn);
        channelListEl.appendChild(item);
      });
    }

    function destroyHls() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    function playChannel(channel) {
      errorMsg.textContent = "";
      nowPlaying.textContent = `Reproduciendo: ${channel.name}`;

      if (window.location.protocol === "https:" && channel.url.startsWith("http://")) {
        errorMsg.textContent =
          "Este stream usa http:// dentro de una web https:// y el navegador lo bloquea por contenido mixto.";
        return;
      }

      destroyHls();
      const isHls = channel.url.toLowerCase().includes(".m3u8");

      if (isHls && window.Hls && window.Hls.isSupported()) {
        hlsInstance = new window.Hls();
        hlsInstance.loadSource(channel.url);
        hlsInstance.attachMedia(videoPlayer);
        hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, () => {
          videoPlayer.play().catch(() => {
            errorMsg.textContent = "Pulsa reproducir en el reproductor para iniciar el flujo.";
          });
        });
        hlsInstance.on(window.Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            errorMsg.textContent = "No se pudo reproducir el flujo HLS.";
          }
        });
      } else {
        videoPlayer.src = channel.url;
        videoPlayer.load();
        videoPlayer.play().catch(() => {
          errorMsg.textContent =
            "No se pudo iniciar la reproducción en este navegador o el enlace no es compatible.";
        });
      }
    }

    async function handleSelectedFile(file) {
      if (!file) return;
      errorMsg.textContent = "";
      try {
        const text = await readFileAsText(file);
        channels = parseM3U(text);
        activeTab = "all";
        tabAll.className = "active-tab";
        tabFavs.className = "secondary";
        renderChannels();
        if (channels.length === 0) {
          errorMsg.textContent =
            `Archivo "${file.name}" leído (${text.length} caracteres), pero no se detectaron canales válidos.`;
        }
      } catch (err) {
        errorMsg.textContent =
          `No se pudo leer "${file.name}": ${err && err.message ? err.message : "error de lectura"}`;
      }
    }

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      await handleSelectedFile(file);
    });

    fileInput.addEventListener("input", async (event) => {
      const file = event.target.files?.[0];
      if (file && channels.length === 0) {
        await handleSelectedFile(file);
      }
    });

    loadUrlBtn.addEventListener("click", async () => {
      const listUrl = urlInput.value.trim();
      if (!listUrl) return;

      errorMsg.textContent = "";
      try {
        const text = await fetchTextWithFallback(listUrl);
        channels = parseM3U(text);
        activeTab = "all";
        tabAll.className = "active-tab";
        tabFavs.className = "secondary";
        renderChannels();
        if (channels.length === 0) {
          errorMsg.textContent = "Se descargó el enlace, pero no se encontraron canales M3U válidos.";
        }
      } catch {
        errorMsg.textContent =
          "No se pudo cargar la lista desde la URL (revisa el enlace, CORS o si está caído).";
      }
    });

    xtreamConnectBtn.addEventListener("click", async () => {
      const rawHost = xtreamHost.value.trim().replace(/\/+$/, "");
      const user = xtreamUser.value.trim();
      const pass = xtreamPass.value.trim();

      if (!rawHost || !user || !pass) {
        errorMsg.textContent = "Completa servidor, usuario y contraseña de Xtream Codes.";
        return;
      }

      errorMsg.textContent = "";
      saveXtreamProfile(rawHost, user, pass);

      const apiUrl =
        `${rawHost}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_streams`;

      try {
        const rawJson = await fetchTextWithFallback(apiUrl);
        const data = JSON.parse(rawJson);

        if (!Array.isArray(data)) {
          errorMsg.textContent = "Respuesta inesperada del servidor Xtream (revisa credenciales o servidor).";
          return;
        }

        channels = data
          .filter((item) => item && item.stream_id)
          .map((item) => ({
            name: item.name || `Canal ${item.stream_id}`,
            url: `${rawHost}/live/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${item.stream_id}.m3u8`
          }));

        activeTab = "all";
        tabAll.className = "active-tab";
        tabFavs.className = "secondary";
        renderChannels();

        if (channels.length === 0) {
          errorMsg.textContent = "Conectado a Xtream, pero no se devolvieron canales en vivo.";
        }
      } catch {
        errorMsg.textContent =
          "No se pudo conectar a Xtream Codes (revisa servidor, credenciales, HTTPS o bloqueo de red).";
      }
    });

    tabAll.addEventListener("click", () => {
      activeTab = "all";
      tabAll.className = "active-tab";
      tabFavs.className = "secondary";
      renderChannels();
    });

    tabFavs.addEventListener("click", () => {
      activeTab = "favs";
      tabFavs.className = "active-tab";
      tabAll.className = "secondary";
      renderChannels();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }

    loadXtreamProfile();
    renderChannels();
  </script>
</body>
</html>
