<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #f5f5f5;
      padding: 16px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
    }
    button,
    label.btn {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      display: inline-block;
    }
    button.secondary {
      background: #2a2a2a;
      color: #ddd;
    }
    button.active-tab {
      background: #2e7d32;
      color: #fff;
    }
    video {
      width: 100%;
      max-height: 240px;
      background: #000;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .status {
      font-size: 0.9rem;
      color: #bbb;
      margin-bottom: 12px;
    }
    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 10px;
      background: #1e1e1e;
      cursor: pointer;
    }
    .channel
